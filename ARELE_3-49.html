<!DOCTYPE html>
<html lang="yi" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árele 3 – פּאַזשע 49</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; display: flex; flex-direction: column; align-items: center; font-family: Arial, sans-serif; padding: 10px; }
  #wrapper { width: 1320px; max-width: 100%; background: white; }
  #game-container { position: relative; width: 100%; }
  #bg-image { width: 100%; display: block; }
  #reveal-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }
  #footer-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px; direction: ltr; }
  #instructions { color: #888; font-size: 16px; }
  #restart-btn { background: none; border: none; color: #999; font-size: 12px; cursor: pointer; font-family: Arial, sans-serif; padding: 2px 6px; }
  #restart-btn:hover { color: #27ae60; }
</style>
</head>
<body>
<div id="wrapper">
  <div id="game-container">
    <img id="bg-image" src="ARELE_3-49.jpg" alt="Árele 3 página 49" crossorigin="anonymous">
    <img id="filled-image" src="ARELE_3-49_lleno.jpg" alt="" crossorigin="anonymous" style="display:none;">
    <canvas id="reveal-canvas"></canvas>
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="footer-row">
    <span id="instructions">Repasa cada dibujo punteado • Trace each dotted drawing</span>
    <button id="restart-btn">↺ Volver a empezar / Start over</button>
  </div>
</div>
<canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>
<script>
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const revealCanvas = document.getElementById('reveal-canvas');
const revealCtx = revealCanvas.getContext('2d');
const img = document.getElementById('bg-image');
const filledImg = document.getElementById('filled-image');
const confettiCanvas = document.getElementById('confetti-canvas');
const confettiCtx = confettiCanvas.getContext('2d');

const items = [
  { name: 'דאַך', label: 'Techo', cx: 0.5227, cy: 0.3235, r: 0.0985, rx0: 0.3333, ry0: 0.2304, rx1: 0.7197, ry1: 0.4235 },
  { name: 'קוימען', label: 'Chimenea', cx: 0.6197, cy: 0.2284, r: 0.0450, rx0: 0.5833, ry0: 0.1961, rx1: 0.6530, ry1: 0.2627 },
  { name: 'בוים', label: 'Árbol', cx: 0.2045, cy: 0.2941, r: 0.0758, rx0: 0.1098, ry0: 0.1618, rx1: 0.3030, ry1: 0.4196 },
  { name: 'טיר', label: 'Puerta', cx: 0.6348, cy: 0.5784, r: 0.0568, rx0: 0.5848, ry0: 0.4775, rx1: 0.6856, ry1: 0.6843 },
  { name: 'פֿענצטער', label: 'Ventana', cx: 0.4848, cy: 0.5441, r: 0.0909, rx0: 0.3803, ry0: 0.4382, rx1: 0.5894, ry1: 0.6696 },
  { name: 'קאַר', label: 'Coche', cx: 0.2652, cy: 0.6029, r: 0.0758, rx0: 0.1803, ry0: 0.5265, rx1: 0.3500, ry1: 0.6843 },
];

let revealed = new Array(items.length).fill(false);
let done = false;

function resize() {
  const rect = img.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  revealCanvas.width = rect.width; revealCanvas.height = rect.height;
  confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight;
  redrawReveals();
}
function redrawReveals() {
  revealCtx.clearRect(0, 0, revealCanvas.width, revealCanvas.height);
  if (!filledImg.complete) return;
  for (let i = 0; i < items.length; i++) {
    if (revealed[i]) {
      const it = items[i];
      const sx = it.rx0 * filledImg.naturalWidth, sy = it.ry0 * filledImg.naturalHeight;
      const sw = (it.rx1 - it.rx0) * filledImg.naturalWidth, sh = (it.ry1 - it.ry0) * filledImg.naturalHeight;
      const dx = it.rx0 * revealCanvas.width, dy = it.ry0 * revealCanvas.height;
      const dw = (it.rx1 - it.rx0) * revealCanvas.width, dh = (it.ry1 - it.ry0) * revealCanvas.height;
      revealCtx.drawImage(filledImg, sx, sy, sw, sh, dx, dy, dw, dh);
    }
  }
}
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playNote(freq, duration = 0.15, type = 'sine', delay = 0) {
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.type = type; osc.frequency.value = freq;
  const start = audioCtx.currentTime + delay;
  gain.gain.setValueAtTime(0.3, start); gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
  osc.start(start); osc.stop(start + duration);
}
function playSuccess() { playNote(659,0.12,'sine',0); playNote(784,0.12,'sine',0.13); playNote(1047,0.18,'sine',0.26); }
function playFanfare() { [523,659,784,1047,784,1047,1175,1319].forEach((f,i)=>playNote(f,0.18,'sine',i*0.15)); }
let confettiParticles = [];
function spawnConfetti(big=false) {
  const count = big ? 180 : 40;
  for (let i=0;i<count;i++) confettiParticles.push({
    x: Math.random()*confettiCanvas.width, y: big?Math.random()*-100:Math.random()*confettiCanvas.height*0.4,
    w: Math.random()*10+6, h: Math.random()*6+4,
    color: ['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6','#1abc9c'][Math.floor(Math.random()*6)],
    vx:(Math.random()-0.5)*4, vy:Math.random()*4+2, angle:Math.random()*Math.PI*2, spin:(Math.random()-0.5)*0.2, life:1 });
  animateConfetti();
}
let confettiRunning=false;
function animateConfetti(){
  if(confettiRunning)return; confettiRunning=true;
  function step(){
    confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    confettiParticles=confettiParticles.filter(p=>p.life>0.01);
    confettiParticles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.angle+=p.spin; p.life-=0.012;
      confettiCtx.save(); confettiCtx.globalAlpha=p.life; confettiCtx.translate(p.x,p.y); confettiCtx.rotate(p.angle);
      confettiCtx.fillStyle=p.color; confettiCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h); confettiCtx.restore(); });
    if(confettiParticles.length>0) requestAnimationFrame(step);
    else { confettiRunning=false; confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
  }
  step();
}
canvas.addEventListener('click',(e)=>{
  if(done)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)/rect.width, my=(e.clientY-rect.top)/rect.height;
  for(let i=0;i<items.length;i++){
    if(revealed[i])continue;
    const it=items[i];
    const dx=(mx-it.cx), dy=(my-it.cy)*(canvas.height/canvas.width)*(1320/1020);
    if(Math.sqrt(dx*dx+dy*dy)<it.r){
      revealed[i]=true; redrawReveals();
      if(revealed.every(v=>v)){ done=true; spawnConfetti(true); playFanfare(); }
      else { spawnConfetti(false); playSuccess(); }
      return;
    }
  }
});
document.getElementById('restart-btn').addEventListener('click',()=>{
  revealed=new Array(items.length).fill(false); done=false; redrawReveals();
  confettiParticles=[]; confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
});
function init(){ resize(); }
img.addEventListener('load',init);
filledImg.addEventListener('load',redrawReveals);
if(img.complete)init();
window.addEventListener('resize',resize);
</script>
</body>
</html>
