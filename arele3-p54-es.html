<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, startTime, duration, type='sine', gainVal=0.25) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(gainVal, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playFanfare() {
  const now = audioCtx.currentTime;
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    playTone(freq, now + i * 0.15, 0.35, 'triangle', 0.3);
  });
}

function playFail() {
  const now = audioCtx.currentTime;
  playTone(220, now, 0.2, 'sawtooth', 0.45);
  playTone(180, now + 0.15, 0.3, 'sawtooth', 0.45);
}

// Confetti drawn as SVG circles appended dynamically
const svg = document.getElementById('mainSvg');
const svgNS = "http://www.w3.org/2000/svg";
let confettiPieces = [];
let confettiGroup = null;
let animFrame = null;

function launchConfetti() {
  if (confettiGroup) confettiGroup.remove();
  confettiGroup = document.createElementNS(svgNS, 'g');
  svg.appendChild(confettiGroup);

  const colors = ['#c0392b', '#f1c40f', '#27ae60', '#2980b9', '#8e44ad', '#e67e22'];
  confettiPieces = [];
  for (let i = 0; i < 100; i++) {
    const rect = document.createElementNS(svgNS, 'rect');
    const w = 8 + Math.random() * 8;
    const h = 10 + Math.random() * 10;
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    rect.setAttribute('fill', colors[Math.floor(Math.random() * colors.length)]);
    confettiGroup.appendChild(rect);

    confettiPieces.push({
      el: rect,
      x: Math.random() * 1320,
      y: -20 - Math.random() * 200,
      w, h,
      speedY: 5 + Math.random() * 6,
      speedX: (Math.random() - 0.5) * 4,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 12
    });
  }
  if (animFrame) cancelAnimationFrame(animFrame);
  animateConfetti();
}

function animateConfetti() {
  let stillFalling = false;
  confettiPieces.forEach(p => {
    p.y += p.speedY;
    p.x += p.speedX;
    p.rotation += p.rotationSpeed;
    if (p.y < 1020 + 40) stillFalling = true;
    p.el.setAttribute('transform', `translate(${p.x},${p.y}) rotate(${p.rotation})`);
  });
  if (stillFalling) {
    animFrame = requestAnimationFrame(animateConfetti);
  } else {
    if (confettiGroup) confettiGroup.remove();
    confettiGroup = null;
  }
}

// Game state
let solved = { freidele: false, yontele: false };

function checkComplete() {
  if (solved.freidele && solved.yontele) {
    document.getElementById('restartBtn').style.display = 'block';
  }
}

document.querySelectorAll('.hitzone').forEach(zone => {
  zone.addEventListener('click', async () => {
    const group = zone.dataset.group;
    if (solved[group]) return;

    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    if (zone.dataset.correct === 'true') {
      solved[group] = true;
      launchConfetti();
      playFanfare();
      checkComplete();
    } else {
      playFail();
    }
  });
});

document.getElementById('restartBtn').addEventListener('click', () => {
  solved = { freidele: false, yontele: false };
  document.getElementById('restartBtn').style.display = 'none';
  if (confettiGroup) { confettiGroup.remove(); confettiGroup = null; }
});
</script>
