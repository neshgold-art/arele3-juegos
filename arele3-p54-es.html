<!DOCTYPE html>
<html lang="yi">
<head>
<meta charset="UTF-8">
<title>ARELE 3 - Page 54</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: sans-serif;
  }
  #gameWrap {
    position: relative;
    width: 1320px;
    height: 1020px;
    box-sizing: border-box;
  }
  #bg {
    width: 1320px;
    height: 1020px;
    display: block;
  }
  canvas#fx {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
  .hitzone {
    position: absolute;
    cursor: pointer;
  }
  #restartBtn {
    position: absolute;
    bottom: 16px;
    right: 16px;
    background: #c0392b;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 16px;
    cursor: pointer;
    display: none;
    z-index: 10;
  }
  #restartBtn:hover { background: #a93226; }
</style>
</head>
<body>

<div id="gameWrap">
  <img id="bg" src="ARELE_3-54.jpg" alt="background">
  <canvas id="fx" width="1320" height="1020"></canvas>

  <!-- Freidele column (left) - correct word is Shpringt -->
  <div class="hitzone" data-correct="true" data-group="freidele" style="left:151px; top:693px; width:160px; height:50px;"></div>
  <div class="hitzone" data-correct="false" data-group="freidele" style="left:140px; top:772px; width:160px; height:50px;"></div>
  <div class="hitzone" data-correct="false" data-group="freidele" style="left:129px; top:839px; width:160px; height:50px;"></div>

  <!-- Yontele column (right) - correct word is Shpilt -->
  <div class="hitzone" data-correct="false" data-group="yontele" style="left:713px; top:691px; width:160px; height:50px;"></div>
  <div class="hitzone" data-correct="false" data-group="yontele" style="left:702px; top:767px; width:160px; height:50px;"></div>
  <div class="hitzone" data-correct="true" data-group="yontele" style="left:691px; top:829px; width:160px; height:50px;"></div>

  <button id="restartBtn">Volver a empezar</button>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, startTime, duration, type='sine', gainVal=0.25) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(gainVal, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playFanfare() {
  const now = audioCtx.currentTime;
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    playTone(freq, now + i * 0.15, 0.35, 'triangle', 0.3);
  });
}

function playFail() {
  const now = audioCtx.currentTime;
  playTone(220, now, 0.2, 'sawtooth', 0.45);
  playTone(180, now + 0.15, 0.3, 'sawtooth', 0.45);
}

// Confetti
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let confettiPieces = [];
let animFrame = null;

function launchConfetti() {
  const colors = ['#c0392b', '#f1c40f', '#27ae60', '#2980b9', '#8e44ad', '#e67e22'];
  confettiPieces = [];
  for (let i = 0; i < 140; i++) {
    confettiPieces.push({
      x: Math.random() * 1320,
      y: -20 - Math.random() * 200,
      w: 6 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: 3 + Math.random() * 4,
      speedX: (Math.random() - 0.5) * 3,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 10
    });
  }
  if (animFrame) cancelAnimationFrame(animFrame);
  animateConfetti();
}

function animateConfetti() {
  ctx.clearRect(0, 0, 1320, 1020);
  let stillFalling = false;
  confettiPieces.forEach(p => {
    p.y += p.speedY;
    p.x += p.speedX;
    p.rotation += p.rotationSpeed;
    if (p.y < 1020 + 20) stillFalling = true;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  });
  if (stillFalling) {
    animFrame = requestAnimationFrame(animateConfetti);
  } else {
    ctx.clearRect(0, 0, 1320, 1020);
  }
}

// Game state
let solved = { freidele: false, yontele: false };

function checkComplete() {
  if (solved.freidele && solved.yontele) {
    document.getElementById('restartBtn').style.display = 'block';
  }
}

document.querySelectorAll('.hitzone').forEach(zone => {
  zone.addEventListener('click', async () => {
    const group = zone.dataset.group;
    if (solved[group]) return; // already solved for this group

    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    if (zone.dataset.correct === 'true') {
      solved[group] = true;
      launchConfetti();
      playFanfare();
      checkComplete();
    } else {
      playFail();
    }
  });
});

document.getElementById('restartBtn').addEventListener('click', () => {
  solved = { freidele: false, yontele: false };
  document.getElementById('restartBtn').style.display = 'none';
  ctx.clearRect(0, 0, 1320, 1020);
});
</script>

</body>
</html>
