<!DOCTYPE html>
<html lang="yi">
<head>
<meta charset="UTF-8">
<title>ARELE 3 - Page 54</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  svg {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .hitzone {
    fill: transparent;
    cursor: pointer;
  }
  #restartBtn {
    cursor: pointer;
  }
  #restartBtn rect {
    fill: #c0392b;
  }
  #restartBtn text {
    fill: #fff;
    font-family: sans-serif;
    font-size: 34px;
    user-select: none;
  }
  #restartBtn:hover rect {
    fill: #a93226;
  }
</style>
</head>
<body>

<svg id="mainSvg" viewBox="0 0 1320 1020" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <image href="ARELE_3-54.jpg" x="0" y="0" width="1320" height="1020"/>

  <!-- Freidele column (left) - correct word is Shpringt -->
  <rect class="hitzone" data-correct="true" data-group="freidele" x="151" y="693" width="160" height="50"/>
  <rect class="hitzone" data-correct="false" data-group="freidele" x="140" y="772" width="160" height="50"/>
  <rect class="hitzone" data-correct="false" data-group="freidele" x="129" y="839" width="160" height="50"/>

  <!-- Yontele column (right) - correct word is Shpilt -->
  <rect class="hitzone" data-correct="false" data-group="yontele" x="713" y="691" width="160" height="50"/>
  <rect class="hitzone" data-correct="false" data-group="yontele" x="702" y="767" width="160" height="50"/>
  <rect class="hitzone" data-correct="true" data-group="yontele" x="691" y="829" width="160" height="50"/>

  <g id="restartBtn" style="display:none;">
    <rect x="1000" y="940" width="290" height="60" rx="10"/>
    <text x="1145" y="978" text-anchor="middle">Start over</text>
  </g>
</svg>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, startTime, duration, type='sine', gainVal=0.25) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(gainVal, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playFanfare() {
  const now = audioCtx.currentTime;
  const notes = [523, 659, 784, 1047];
  notes.forEach((freq, i) => {
    playTone(freq, now + i * 0.15, 0.35, 'triangle', 0.3);
  });
}

function playFail() {
  const now = audioCtx.currentTime;
  playTone(220, now, 0.2, 'sawtooth', 0.45);
  playTone(180, now + 0.15, 0.3, 'sawtooth', 0.45);
}

// Confetti drawn as SVG circles appended dynamically
const svg = document.getElementById('mainSvg');
const svgNS = "http://www.w3.org/2000/svg";
let confettiPieces = [];
let confettiGroup = null;
let animFrame = null;

function launchConfetti() {
  if (confettiGroup) confettiGroup.remove();
  confettiGroup = document.createElementNS(svgNS, 'g');
  svg.appendChild(confettiGroup);

  const colors = ['#c0392b', '#f1c40f', '#27ae60', '#2980b9', '#8e44ad', '#e67e22'];
  confettiPieces = [];
  for (let i = 0; i < 100; i++) {
    const rect = document.createElementNS(svgNS, 'rect');
    const w = 8 + Math.random() * 8;
    const h = 10 + Math.random() * 10;
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    rect.setAttribute('fill', colors[Math.floor(Math.random() * colors.length)]);
    confettiGroup.appendChild(rect);

    confettiPieces.push({
      el: rect,
      x: Math.random() * 1320,
      y: -20 - Math.random() * 200,
      w, h,
      speedY: 5 + Math.random() * 6,
      speedX: (Math.random() - 0.5) * 4,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 12
    });
  }
  if (animFrame) cancelAnimationFrame(animFrame);
  animateConfetti();
}

function animateConfetti() {
  let stillFalling = false;
  confettiPieces.forEach(p => {
    p.y += p.speedY;
    p.x += p.speedX;
    p.rotation += p.rotationSpeed;
    if (p.y < 1020 + 40) stillFalling = true;
    p.el.setAttribute('transform', `translate(${p.x},${p.y}) rotate(${p.rotation})`);
  });
  if (stillFalling) {
    animFrame = requestAnimationFrame(animateConfetti);
  } else {
    if (confettiGroup) confettiGroup.remove();
    confettiGroup = null;
  }
}

// Game state
let solved = { freidele: false, yontele: false };

function checkComplete() {
  if (solved.freidele && solved.yontele) {
    document.getElementById('restartBtn').style.display = 'block';
  }
}

document.querySelectorAll('.hitzone').forEach(zone => {
  zone.addEventListener('click', async () => {
    const group = zone.dataset.group;
    if (solved[group]) return;

    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    if (zone.dataset.correct === 'true') {
      solved[group] = true;
      launchConfetti();
      playFanfare();
      checkComplete();
    } else {
      playFail();
    }
  });
});

document.getElementById('restartBtn').addEventListener('click', () => {
  solved = { freidele: false, yontele: false };
  document.getElementById('restartBtn').style.display = 'none';
  if (confettiGroup) { confettiGroup.remove(); confettiGroup = null; }
});
</script>

</body>
</html>
