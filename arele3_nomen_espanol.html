];
// Puntos ROJOS (palabras) - destino. Mismo id = pareja correcta
const ENDS=[
  {id:0, x:0.6303, y:0.3667},  // tijeras -> שערל
  {id:1, x:0.5076, y:0.2353},  // serpiente -> שלאַנג
  {id:2, x:0.6106, y:0.7824},  // silla -> שטול
  {id:3, x:0.4197, y:0.7157},  // estrella -> שטערן
  {id:4, x:0.8652, y:0.5255},  // casa -> שטוב
  {id:5, x:0.1485, y:0.4549}   // llave -> שליסל
];

let W,H,DOT,HIT;
let lines=[];
let dragging=null;
let done=false;
let confettiPieces=[],confettiAnim=null;

function resize(){
  const r=bgImg.getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=W; cv.height=H;
  confettiCanvas.width=W; confettiCanvas.height=H;
  DOT=Math.max(7,W*0.011);
  HIT=Math.max(26,W*0.045);
  render();
}
function px(p){return {x:p.x*W, y:p.y*H};}

function render(){
  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round';
  lines.forEach(l=>{
    const a=px(STARTS[l.from]), b=px(ENDS[l.to]);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle='#3E4A5B'; ctx.lineWidth=Math.max(3,W*0.005); ctx.stroke();
  });
  if(dragging){
    const a=px(STARTS[dragging.from]);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(dragging.cx,dragging.cy);
    ctx.strokeStyle='#3E4A5B'; ctx.lineWidth=Math.max(3,W*0.005);
    ctx.setLineDash([8,6]); ctx.stroke(); ctx.setLineDash([]);
  }
  STARTS.forEach(s=>{
    const used=lines.some(l=>l.from===s.id); const p=px(s);
    ctx.beginPath(); ctx.arc(p.x,p.y,DOT,0,Math.PI*2);
    ctx.fillStyle= used ? '#0F6E56' : '#2255cc';
    ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  });
  ENDS.forEach(e=>{
    const used=lines.some(l=>l.to===e.id); const p=px(e);
    ctx.beginPath(); ctx.arc(p.x,p.y,DOT,0,Math.PI*2);
    ctx.fillStyle= used ? '#0F6E56' : '#e63030';
    ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  });
}

function evtPos(e){
  const r=cv.getBoundingClientRect();
  const t=e.touches ? e.touches[0] : e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}
function startDrag(e){
  if(done)return;
  const p=evtPos(e);
  for(const s of STARTS){
    if(lines.some(l=>l.from===s.id))continue;
    const c=px(s);
    if(Math.hypot(p.x-c.x,p.y-c.y)<HIT){
      dragging={from:s.id, cx:p.x, cy:p.y}; e.preventDefault(); render(); return;
    }
  }
}
function moveDrag(e){
  if(!dragging)return;
  const p=evtPos(e); dragging.cx=p.x; dragging.cy=p.y; e.preventDefault(); render();
}
function endDrag(e){
  if(!dragging)return;
  const p={x:dragging.cx, y:dragging.cy};
  let landed=null;
  for(const en of ENDS){
    if(lines.some(l=>l.to===en.id))continue;
    const c=px(en);
    if(Math.hypot(p.x-c.x,p.y-c.y)<HIT){ landed=en.id; break; }
  }
  const from=dragging.from; dragging=null;
  if(landed!==null){
    if(landed===from){
      lines.push({from:from, to:landed});
      playGoodSound(); launchConfetti(30);
      if(lines.length===STARTS.length){
        done=true; msgEl.textContent='¡Muy bien! Uniste todos los dibujos 🎉'; msgEl.className='msg win';
        setTimeout(()=>{launchConfetti(140); playWinSound();},250);
      }
    }else{ playWrongSound(); shakeWrap(); }
  }
  render();
}
function shakeWrap(){
  wrap.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},
    {transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:320});
}
function tone(freqs,type,dur,vol){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.frequency.value=f; o.type=type;
      g.gain.setValueAtTime(vol, ac.currentTime+i*dur);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+i*dur+dur*1.6);
      o.start(ac.currentTime+i*dur); o.stop(ac.currentTime+i*dur+dur*1.6);
    });
  }catch(e){}
}
function playGoodSound(){ tone([659,784,1047],'sine',0.12,0.3); }
function playWinSound(){ tone([523,659,784,1047,784,1047,1319],'sine',0.15,0.3); }
function playWrongSound(){ tone([200,150],'sawtooth',0.12,0.25); }
function launchConfetti(n){
  for(let i=0;i<n;i++){
    confettiPieces.push({
      x:Math.random()*W, y:-20-Math.random()*80,
      w:6+Math.random()*8, h:4+Math.random()*6,
      color:['#e63030','#2eaa2e','#2255cc','#f57c00','#9c27b0','#f5c800','#f06090','#00bcd4'][Math.floor(Math.random()*8)],
      angle:Math.random()*360, spin:(Math.random()-0.5)*8,
      vx:(Math.random()-0.5)*4, vy:3+Math.random()*5, opacity:1
    });
  }
  if(confettiAnim)cancelAnimationFrame(confettiAnim);
  animateConfetti();
}
function animateConfetti(){
  cctx.clearRect(0,0,W,H); let alive=false;
  confettiPieces.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.angle+=p.spin;
    if(p.y<H)alive=true;
    if(p.opacity>0&&p.y<H+20){
      cctx.save(); cctx.globalAlpha=Math.max(0,p.opacity);
      cctx.translate(p.x,p.y); cctx.rotate(p.angle*Math.PI/180);
      cctx.fillStyle=p.color; cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cctx.restore();
    }
  });
  if(alive)confettiAnim=requestAnimationFrame(animateConfetti);
  else { confettiPieces=[]; cctx.clearRect(0,0,W,H); }
}
function resetGame(){
  lines=[]; dragging=null; done=false;
  if(confettiAnim)cancelAnimationFrame(confettiAnim);
  confettiPieces=[]; cctx.clearRect(0,0,W,H);
  msgEl.textContent='Traza una línea de cada dibujo a su palabra'; msgEl.className='msg'; render();
}
cv.addEventListener('mousedown',startDrag);
cv.addEventListener('mousemove',moveDrag);
window.addEventListener('mouseup',endDrag);
cv.addEventListener('touchstart',startDrag,{passive:false});
cv.addEventListener('touchmove',moveDrag,{passive:false});
cv.addEventListener('touchend',endDrag);
bgImg.addEventListener('load',resize);
window.addEventListener('resize',resize);
if(bgImg.complete)resize();
</script>
</body>
